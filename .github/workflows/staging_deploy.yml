name: Staging Deploy

on:
  workflow_call:
    inputs:
      source_branch:
        description: 'デプロイ元のブランチ名'
        required: false
        default: 'release-candidate'
        type: string
      target_branch:
        description: 'デプロイ先のブランチ名'
        required: false
        default: 'staging'
        type: string
      runs_on:
        description: 'GitHub Actions runner to use'
        required: false
        type: string
        default: 'linux-arm64-default'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-staging-pr:
    runs-on: ${{ inputs.runs_on }}
    if: contains(github.event.head_commit.message, '[skip deploy]') == false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check existing PR
        id: check-pr
        run: |
          # NOTE: 既存のPRがあるかチェック
          pr_number=$(gh pr list --head ${{ inputs.source_branch }} --base ${{ inputs.target_branch }} --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            echo "existing_pr=$pr_number" >> $GITHUB_OUTPUT
            echo "既存のPR #$pr_number が見つかりました"
          else
            echo "existing_pr=" >> $GITHUB_OUTPUT
            echo "既存のPRは見つかりませんでした"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: create-pr
        if: steps.check-pr.outputs.existing_pr == ''
        run: |
          # NOTE: GitHub CLIでPRを作成
          pr_body="## デプロイ内容

          ${{ inputs.source_branch }}ブランチの最新の変更を${{ inputs.target_branch }}ブランチにデプロイします。

          ### 変更内容
          ${{ github.event.head_commit.message }}

          CIが全て通過したら自動的にマージされます。

          ---
          _このPRは自動生成されました_"

          # NOTE: auto-deploy stagingラベルが存在しない場合は作成
          if ! gh label list --search "auto-deploy staging" --json name --jq '.[].name' | grep -q "auto-deploy staging"; then
            echo "auto-deploy stagingラベルが存在しないため作成します"
            gh label create "auto-deploy staging" --color "0e8a16" --description "自動デプロイPR用のラベル"
          fi

          # NOTE: 現在の日時を取得してPRタイトルに含める
          current_date=$(date '+%Y-%m-%d %H:%M')

          pr_url=$(gh pr create \
            --title "🚀 [$current_date] Deploy to ${{ inputs.target_branch }} from ${{ inputs.source_branch }}" \
            --body "$pr_body" \
            --base ${{ inputs.target_branch }} \
            --head ${{ inputs.source_branch }} \
            --label "auto-deploy staging")

          # NOTE: PRのURLからPR番号を抽出
          pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          echo "新しいPR #$pr_number を作成しました"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for new PR
        if: steps.create-pr.outputs.pr_number != ''
        run: |
          # NOTE: 新しく作成されたPRに対して自動マージを設定
          gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --merge
          echo "PR #${{ steps.create-pr.outputs.pr_number }} に自動マージを設定しました"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for existing PR
        if: steps.check-pr.outputs.existing_pr != ''
        run: |
          # NOTE: 既存のPRに対して自動マージを設定（まだ設定されていない場合）
          gh pr merge ${{ steps.check-pr.outputs.existing_pr }} --auto --merge
          echo "既存のPR #${{ steps.check-pr.outputs.existing_pr }} に自動マージを設定しました"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update existing PR
        if: steps.check-pr.outputs.existing_pr != ''
        run: |
          # NOTE: 既存のPRの説明を最新のコミット情報で更新
          pr_body="## デプロイ内容

          ${{ inputs.source_branch }}ブランチの最新の変更を${{ inputs.target_branch }}ブランチにデプロイします。

          ### 最新の変更内容
          ${{ github.event.head_commit.message }}

          CIが全て通過したら自動的にマージされます。

          ---
          _このPRは自動生成されました（最終更新: $(date '+%Y-%m-%d %H:%M:%S'))_"

          gh pr edit ${{ steps.check-pr.outputs.existing_pr }} --body "$pr_body"
          echo "既存のPR #${{ steps.check-pr.outputs.existing_pr }} の説明を更新しました"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: デプロイ後の通知ジョブ（オプション）
  notify-deployment:
    runs-on: ${{ inputs.runs_on }}
    needs: create-staging-pr
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.create-staging-pr.result }}" == "success" ]; then
            echo "✅ Staging deployment workflow completed successfully"
          else
            echo "❌ Failed to process staging deployment"
            exit 1
          fi
