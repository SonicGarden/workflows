name: Staging Deploy

on:
  workflow_call:
    inputs:
      source_branch:
        description: "デプロイ元のブランチ名"
        required: false
        default: "release-candidate"
        type: string
      target_branch:
        description: "デプロイ先のブランチ名"
        required: false
        default: "staging"
        type: string
      runs_on:
        description: "GitHub Actions runner to use"
        required: false
        type: string
        default: "ubuntu-slim"
      enable_auto_merge:
        description: "CI通過後にPRを自動マージするか"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # NOTE: コミットメッセージのような外部由来のフリーテキストは run: に直接展開せず env 経由で受ける
  #       （GitHub Actions injection 対策）。ブランチ名(inputs.*)とPR番号(数値のみ)は
  #       呼び出し側が書くリテラルか数値限定のため直接展開のままとしている。
  create-staging-pr:
    runs-on: ${{ inputs.runs_on }}
    if: contains(github.event.head_commit.message, '[skip deploy]') == false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Check existing PR
        id: check-pr
        run: |
          # NOTE: 既存のPRがあるかチェック
          pr_number=$(gh pr list --head ${{ inputs.source_branch }} --base ${{ inputs.target_branch }} --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            echo "existing_pr=$pr_number" >> $GITHUB_OUTPUT
            echo "既存のPR #$pr_number が見つかりました"
          else
            echo "existing_pr=" >> $GITHUB_OUTPUT
            echo "既存のPRは見つかりませんでした"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        id: create-pr
        if: steps.check-pr.outputs.existing_pr == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: untrusted input を run: に直接展開せず env 経由で受ける（GitHub Actions injection 対策）
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          # NOTE: GitHub CLIでPRを作成
          cat <<EOF > pr_body.md
          ## デプロイ内容

          ${SOURCE_BRANCH}ブランチの最新の変更を${TARGET_BRANCH}ブランチにデプロイします。

          ### 変更内容
          ${COMMIT_MESSAGE}

          CIが全て通過したら、設定に応じて自動的にマージされます。

          ---
          _このPRは自動生成されました_
          EOF

          # NOTE: auto-deploy stagingラベルが存在しない場合は作成
          if ! gh label list --search "auto-deploy staging" --json name --jq '.[].name' | grep -q "auto-deploy staging"; then
            echo "auto-deploy stagingラベルが存在しないため作成します"
            gh label create "auto-deploy staging" --color "0e8a16" --description "自動デプロイPR用のラベル"
          fi

          # NOTE: 現在の日時を取得してPRタイトルに含める
          current_date=$(date '+%Y-%m-%d %H:%M')

          pr_url=$(gh pr create \
            --title "🚀 [$current_date] Deploy to ${TARGET_BRANCH} from ${SOURCE_BRANCH}" \
            --body-file pr_body.md \
            --base "${TARGET_BRANCH}" \
            --head "${SOURCE_BRANCH}" \
            --label "auto-deploy staging")

          # NOTE: PRのURLからPR番号を抽出
          pr_number=$(echo "$pr_url" | grep -oE '[0-9]+$')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          echo "新しいPR #$pr_number を作成しました"

      - name: Enable auto-merge for new PR
        if: inputs.enable_auto_merge && steps.create-pr.outputs.pr_number != ''
        run: |
          # NOTE: 新しく作成されたPRに対して自動マージを設定
          gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --merge
          echo "PR #${{ steps.create-pr.outputs.pr_number }} に自動マージを設定しました"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for existing PR
        if: inputs.enable_auto_merge && steps.check-pr.outputs.existing_pr != ''
        run: |
          # NOTE: 既存のPRに対して自動マージを設定（まだ設定されていない場合）
          gh pr merge ${{ steps.check-pr.outputs.existing_pr }} --auto --merge
          echo "既存のPR #${{ steps.check-pr.outputs.existing_pr }} に自動マージを設定しました"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update existing PR
        if: steps.check-pr.outputs.existing_pr != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: untrusted input を run: に直接展開せず env 経由で受ける（GitHub Actions injection 対策）
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          EXISTING_PR: ${{ steps.check-pr.outputs.existing_pr }}
        run: |
          # NOTE: 既存のPRの説明を最新のコミット情報で更新
          cat <<EOF > pr_body.md
          ## デプロイ内容

          ${SOURCE_BRANCH}ブランチの最新の変更を${TARGET_BRANCH}ブランチにデプロイします。

          ### 最新の変更内容
          ${COMMIT_MESSAGE}

          CIが全て通過したら、設定に応じて自動的にマージされます。

          ---
          _このPRは自動生成されました（最終更新: $(date '+%Y-%m-%d %H:%M:%S'))_
          EOF

          gh pr edit "${EXISTING_PR}" --body-file pr_body.md
          echo "既存のPR #${EXISTING_PR} の説明を更新しました"

  # NOTE: デプロイ後の通知ジョブ（オプション）
  notify-deployment:
    runs-on: ${{ inputs.runs_on }}
    needs: create-staging-pr
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.create-staging-pr.result }}" == "success" ]; then
            echo "✅ Staging deployment workflow completed successfully"
          else
            echo "❌ Failed to process staging deployment"
            exit 1
          fi
