name: gem_changelog

on:
  workflow_call:
    secrets:
      rubygemsToken:
        description: A API token of rubygems.org. Required scope is `Index rubygems`.
        required: false

jobs:
  pre_job:
    runs-on: ubuntu-slim
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          paths: '["Gemfile.lock"]'

  gem_changelog:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: kzkn/rubygems-changelog-url-action@e465910458be8fa448392318c1f6e4f70f3baef0 # main (2026-07-22)
        with:
          githubToken: ${{ github.token }}
          rubygemsToken: ${{ secrets.rubygemsToken }}
