name: gem_changelog

on:
  workflow_call:
    secrets:
      rubygemsToken:
        description: A API token of rubygems.org. Required scope is `Index rubygems`.
        required: false

jobs:
  pre_job:
    runs-on: ubuntu-slim
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Migration notice
        run: echo "::warning title=移行のお願い::gem_changelog は呼び出し側リポジトリへのべた書きへの移行を推奨しています。2027/02/28 以降はこのリポジトリのワークフローを読み込めなくなります。actions.lock で依存 action を固定できるようになります。手順は https://github.com/SonicGarden/workflows#2-gem_changelog を参照してください。"
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578
        with:
          paths: '["Gemfile.lock"]'

  gem_changelog:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - uses: kzkn/rubygems-changelog-url-action@e465910458be8fa448392318c1f6e4f70f3baef0
        with:
          githubToken: ${{ github.token }}
          rubygemsToken: ${{ secrets.rubygemsToken }}
