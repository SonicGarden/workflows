name: copytuner_deploy

on:
  workflow_call:
    secrets:
      apiKey:
        description: API key for Copytuner.
        required: true

jobs:
  copytuner_deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run deploy
        env:
          COPYTUNER_API_KEY: ${{ secrets.apiKey }}
        run: |
          bin/rake copy_tuner:deploy
