name: copytuner_deploy

on:
  workflow_call:
    secrets:
      apiKey:
        description: API key for Copytuner.
        required: true

jobs:
  copytuner_deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Migration notice
        run: echo "::warning title=移行のお願い::copytuner_deploy は呼び出し側リポジトリへのべた書きへの移行を推奨しています。2027/02/28 以降はこのリポジトリのワークフローを読み込めなくなります。actions.lock で依存 action を固定できるようになります。手順は https://github.com/SonicGarden/workflows#1-copytuner_deploy を参照してください。"

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run deploy
        env:
          COPYTUNER_API_KEY: ${{ secrets.apiKey }}
        run: |
          bin/rake copy_tuner:deploy
