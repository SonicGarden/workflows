name: copytuner_deploy

on:
  workflow_call:
    secrets:
      apiKey:
        description: API key for Copytuner.
        required: true

jobs:
  copytuner_deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Run deploy
        env:
          COPYTUNER_API_KEY: ${{ secrets.apiKey }}
        run: |
          bin/rake copy_tuner:deploy
