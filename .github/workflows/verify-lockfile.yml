# actions.lock がワークフローの uses: とずれていたり、
# 記録したコミットが上流のタグから辿れなくなっていたりしたら失敗させる。
# ずれたまま main に入ると、ロックファイルに無い action がタグのまま動いてしまうため。

name: verify-lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify
