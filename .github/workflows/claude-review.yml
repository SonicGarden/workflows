name: Claude Code Review

on:
  workflow_call:
    inputs:
      guideline_file:
        description: 'Path to the guideline file for code review'
        required: false
        type: string
        default: ''
      focus_areas:
        description: 'Focus areas for code review'
        required: false
        type: string
        default: |
          - コード品質とベストプラクティス
          - 潜在的なバグや問題
          - パフォーマンスと効率性
          - セキュリティ（認証・認可・入力検証）
          - テストカバレッジと品質
          - データ整合性とエラーハンドリング
          - アーキテクチャとコンポーネント分離
          - 命名規則とコードの明確性
      model:
        description: 'Claude model to use (empty for default Sonnet 4)'
        required: false
        type: string
        default: ''
    secrets:
      claude_oauth_token:
        required: false
        description: Claude OAuth token for code review
      anthropic_api_key:
        required: false
        description: Anthropic API key for code review

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: aki77/delete-pr-comments-action@main
        with:
          token: ${{ github.token }}
          usernames: claude[bot]
          noReply: "true"
          includeOverallReviewComments: "true"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.claude_oauth_token }}
          anthropic_api_key: ${{ secrets.claude_oauth_token != '' && '' || secrets.anthropic_api_key }}
          model: ${{ inputs.model }}

          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            ${{ inputs.guideline_file != '' && format('`{0}`のガイドラインに従ってPRレビューを実施してください。', inputs.guideline_file) || 'PRレビューを実施してください。' }}

            **重要: すべてのフィードバックとコメントは日本語で提供してください。**

            **レビュー手順:**
            1. `mcp__github__create_pending_pull_request_review`でレビュー開始
            2. `mcp__github__get_pull_request_diff`で変更内容と行番号を確認
            3. `mcp__github__add_pull_request_review_comment_to_pending_review`で具体的なフィードバックをインライン追加
            4. `mcp__github__submit_pending_pull_request_review`でイベントタイプ"COMMENT"として送信

            **重点領域:**
            ${{ inputs.focus_areas }}

            建設的で具体的な改善提案を行い、行固有の問題にはインラインコメント、全体総括はレビュー送信時に含めてください。

          use_sticky_comment: true
          allowed_tools: "mcp__github__create_pending_pull_request_review,mcp__github__add_pull_request_review_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__get_pull_request_diff"
