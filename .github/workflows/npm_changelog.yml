name: npm_changelog

on:
  workflow_call:
    inputs:
      lockPath:
        description: Lock file path.
        default: "yarn.lock"
        required: false
        type: string
      runs_on:
        description: "GitHub Actions runner to use"
        required: false
        type: string
        default: "ubuntu-slim"

jobs:
  pre_job:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Migration notice
        run: echo "::warning title=移行のお願い::npm_changelog は呼び出し側リポジトリへのべた書きへの移行を推奨しています。actions.lock で依存 action を固定できるようになります。手順は https://github.com/SonicGarden/workflows#5-npm_changelog を参照してください。"
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578
        with:
          paths: '["**/yarn.lock", "**/package-lock.json", "**/pnpm-lock.yaml"]'

  npm_changelog:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - uses: kzkn/npm-changelog-url-action@v2
        with:
          githubToken: ${{ github.token }}
          lockPath: ${{ inputs.lockPath }}
          onlySpecifiedPackages: true
