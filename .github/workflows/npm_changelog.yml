name: npm_changelog

on:
  workflow_call:
    inputs:
      lockPath:
        description: Lock file path.
        default: "yarn.lock"
        required: false
        type: string
      runs_on:
        description: "GitHub Actions runner to use"
        required: false
        type: string
        default: "ubuntu-slim"

jobs:
  pre_job:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          paths: '["**/yarn.lock", "**/package-lock.json", "**/pnpm-lock.yaml"]'

  npm_changelog:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: kzkn/npm-changelog-url-action@e802496afc7b7579b56083918ca00bc26d23a3ba # v2.1.0
        with:
          githubToken: ${{ github.token }}
          lockPath: ${{ inputs.lockPath }}
          onlySpecifiedPackages: true
