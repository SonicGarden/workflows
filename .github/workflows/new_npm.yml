name: new_npm

on:
  workflow_call:
    inputs:
      runs_on:
        description: "GitHub Actions runner to use"
        required: false
        type: string
        default: "ubuntu-slim"

jobs:
  pre_job:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Migration notice
        run: echo "::warning title=移行してください::new_npm は 2027/02/28 以降、このリポジトリから読み込めなくなります。それまでに呼び出し側リポジトリへべた書きし、actions.lock で依存 action を固定してください。手順は https://github.com/SonicGarden/workflows#4-new_npm を参照してください。"
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578
        with:
          paths: '["package.json"]'

  new_npm:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: hiwelo/new-dependencies-action@e4175e14484328f9ab56df91e420e90ad5031c08
        with:
          token: ${{ github.token }}
