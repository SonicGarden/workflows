name: new_npm

on:
  workflow_call:
    inputs:
      runs_on:
        description: "GitHub Actions runner to use"
        required: false
        type: string
        default: "ubuntu-slim"

jobs:
  pre_job:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          paths: '["package.json"]'

  new_npm:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: hiwelo/new-dependencies-action@1.0.1
        with:
          token: ${{ github.token }}
