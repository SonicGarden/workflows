name: new_gems

on:
  workflow_call:

jobs:
  pre_job:
    runs-on: ubuntu-slim
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Migration notice
        run: echo "::warning title=移行してください::new_gems は 2027/02/28 以降、このリポジトリから読み込めなくなります。それまでに呼び出し側リポジトリへべた書きし、actions.lock で依存 action を固定してください。手順は https://github.com/SonicGarden/workflows#3-new_gems を参照してください。"
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578
        with:
          paths: '["Gemfile"]'

  new_gems:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - uses: aki77/new-gems-action@v2
        with:
          token: ${{ github.token }}
